    <script>
      // Show startup errors on screen: there is no console on a phone.
      function showBootError(msg) {
        var d = document.createElement('pre');
        d.style.cssText = 'color:#fff;background:#900;padding:12px;white-space:pre-wrap;font:14px monospace';
        d.textContent = 'Error: ' + msg;
        document.body.appendChild(d);
      }
      window.addEventListener('error', function (e) { showBootError(e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); });
      window.addEventListener('unhandledrejection', function (e) { showBootError(String(e.reason)); });
    </script>
